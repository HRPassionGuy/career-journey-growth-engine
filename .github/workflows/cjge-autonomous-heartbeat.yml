name: CJGE Autonomous Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [cloud-migration]
    paths: [.github/workflows/cjge-autonomous-heartbeat.yml]

permissions:
  contents: read

concurrency:
  group: cjge-autonomous-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake CJGE control plane
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_WEBHOOK_TOKEN: ${{ secrets.CJGE_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CJGE_BASE_URL}"
          test -n "${CJGE_WEBHOOK_TOKEN}"
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --retry 2 --max-time 30 \
            -X POST "${CJGE_BASE_URL}/api/tick" \
            -H "Authorization: Bearer ${CJGE_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}')
          jq . "$response_file"
          test "$status" = "200"
