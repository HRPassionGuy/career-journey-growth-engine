name: CJGE CEO Cloud Queue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing CJGE CEO issue to queue or recheck
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'HRPassionGuy' && startsWith(github.event.issue.title, '[CJGE CEO]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out non-model queue worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Persist CEO request in the Cloud queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          node ./bin/github-cloud-queue.mjs "$ISSUE_NUMBER"
