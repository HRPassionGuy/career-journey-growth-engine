name: CJGE Dispatch Callback Verification

on:
  push:
    branches:
      - controlled-live-test-20260923

permissions:
  contents: read

jobs:
  verify-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify restored terminal callback route
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_DISPATCH_CALLBACK_TOKEN: ${{ secrets.CJGE_DISPATCH_CALLBACK_TOKEN }}
        run: |
          payload=$(jq -n             --arg assignmentId "ASN-COS-LIVE-TEST-20260923-001"             --arg dispatchKey "dispatch:ASN-COS-LIVE-TEST-20260923-001:1"             --arg status "completed"             --arg taskEvidence "Controlled live CJGE test completed with durable Chief of Staff synthesis."             '{assignmentId:$assignmentId,dispatchKey:$dispatchKey,status:$status,taskEvidence:$taskEvidence,error:""}')
          curl --fail-with-body --retry 2 --max-time 30             -X POST "${CJGE_BASE_URL}/api/dispatch-status"             -H "Authorization: Bearer ${CJGE_DISPATCH_CALLBACK_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"
