name: CJGE Chief of Staff Intake Verification

on:
  push:
    branches:
      - controlled-live-test-20260923

permissions:
  contents: read

jobs:
  verify-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit controlled authenticated Chief of Staff request
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_WEBHOOK_TOKEN: ${{ secrets.CJGE_WEBHOOK_TOKEN }}
        run: |
          payload=$(jq -n             --arg requestId "CEO-INTAKE-SMOKE-20260923-001"             --arg request "Controlled intake verification only. Confirm receipt through the Chief of Staff front door. Do not delegate, contact anyone, publish anything, spend money, or perform any external action."             '{requestId:$requestId,request:$request}')
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}"             --retry 2 --max-time 30             -X POST "${CJGE_BASE_URL}/api/chief-of-staff"             -H "Authorization: Bearer ${CJGE_WEBHOOK_TOKEN}"             -H "Content-Type: application/json"             --data "$payload")
          jq . "$response_file"
          test "$status" = "202"
          jq -e '.assignmentId and .status' "$response_file" >/dev/null
