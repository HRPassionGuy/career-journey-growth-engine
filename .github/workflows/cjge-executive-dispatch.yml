name: CJGE Executive Dispatch

on:
  workflow_dispatch:
    inputs:
      deployment_ref:
        required: true
        type: string
      assignment_id:
        required: true
        type: string
      executive:
        required: true
        type: string
      entry_point:
        required: true
        type: string
      dispatch_key:
        required: true
        type: string
      dispatched_at:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cjge-${{ inputs.dispatch_key }}
  cancel-in-progress: false

jobs:
  execute-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authoritative deployment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_ref }}
          persist-credentials: false

      - name: Claim assignment through CJGE control plane
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          EXECUTIVE: ${{ inputs.executive }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          node "$ENTRY_POINT" claim "$EXECUTIVE" "$ASSIGNMENT_ID" "$DISPATCH_KEY" > /tmp/cjge-claim.json
          cp /tmp/cjge-claim.json "$GITHUB_WORKSPACE/.cjge-claim.json"

      - name: Execute CJGE assignment with Codex
        id: codex
        if: ${{ vars.CJGE_API_EXECUTION_ENABLED == 'true' }}
        continue-on-error: true
        uses: openai/codex-action@v1
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: .cjge-codex-result.txt
          prompt: |
            Execute Career Journey Growth Engine assignment ${{ inputs.assignment_id }} as the ${{ inputs.executive }} executive.
            The assignment has already been claimed securely through the CJGE control plane. Read .cjge-claim.json first.
            Read every governing file identified by that claim, including AGENTS.md, the Project Constitution, the executive charter, runtime, and procedures.
            Perform the assignment within that governance and the existing cost, approval, evidence, and external-action rules.
            Current Chief of Staff diagnostic assignments are internal-only. Do not access browsers, social platforms, email, n8n, or other external accounts for these assignments.
            Your final response must be concise JSON containing: status, summary, evidence, metrics, verifiedAt, and externalActionAt. Use null for externalActionAt when no external action occurs.
            For an original CEO Chief of Staff request only, include delegations when independent executive input is needed. Each delegation must specify executive and a bounded internal-only objective; use no more than two executives. Omit delegations for a synthesis assignment and for any executive other than Chief of Staff.

      - name: Persist terminal result through CJGE control plane
        id: persist
        if: always() && steps.codex.outcome == 'success'
        continue-on-error: true
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          EXECUTIVE: ${{ inputs.executive }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          execution_id=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('.cjge-claim.json','utf8'));console.log(x.executionId||x.execution?.id||x.value?.executionId||'')")
          if [ -z "$execution_id" ]; then echo "Missing execution id from claim" >&2; exit 1; fi
          raw=$(cat .cjge-codex-result.txt)
          result_json=$(node -e "const s=process.argv[1]; const a=s.indexOf('{'), b=s.lastIndexOf('}'); if(a<0||b<a) process.exit(2); const o=JSON.parse(s.slice(a,b+1)); o.dispatchKey=process.env.DISPATCH_KEY; process.stdout.write(JSON.stringify(o));" "$raw")
          node "$ENTRY_POINT" result "$EXECUTIVE" "$ASSIGNMENT_ID" "$execution_id" "$result_json"

      - name: Read durable terminal evidence
        id: evidence
        if: always()
        continue-on-error: true
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          EXECUTIVE: ${{ inputs.executive }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          evidence=$(node "$ENTRY_POINT" evidence "$EXECUTIVE" "$ASSIGNMENT_ID" "$DISPATCH_KEY" 2>&1)
          delimiter="CJGE_$(date +%s)_${RANDOM}"
          {
            echo "result<<${delimiter}"
            echo "$evidence"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Record terminal Codex Action lifecycle
        if: always()
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_DISPATCH_CALLBACK_TOKEN: ${{ secrets.CJGE_DISPATCH_CALLBACK_TOKEN }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          RESULT_EVIDENCE: ${{ steps.evidence.outputs.result }}
        run: |
          status=completed
          error=""
          if [ "$CODEX_OUTCOME" != "success" ]; then status=failed; error="codex-action outcome: ${CODEX_OUTCOME}"; fi
          if [ "$status" = "completed" ] && [ "$PERSIST_OUTCOME" != "success" ]; then status=failed; error="result persistence outcome: ${PERSIST_OUTCOME}"; fi
          payload=$(jq -n --arg assignmentId "$ASSIGNMENT_ID" --arg dispatchKey "$DISPATCH_KEY" --arg status "$status" --arg taskEvidence "$RESULT_EVIDENCE" --arg error "$error" '{assignmentId:$assignmentId,dispatchKey:$dispatchKey,status:$status,taskEvidence:$taskEvidence,error:$error}')
          curl --fail-with-body --retry 2 --max-time 30 -X POST "${CJGE_BASE_URL}/api/dispatch-status" -H "Authorization: Bearer ${CJGE_DISPATCH_CALLBACK_TOKEN}" -H "Content-Type: application/json" --data "$payload"
