name: CJGE Executive Dispatch

on:
  workflow_dispatch:
    inputs:
      deployment_ref:
        required: true
        type: string
      assignment_id:
        required: true
        type: string
      executive:
        required: true
        type: string
      entry_point:
        required: true
        type: string
      dispatch_key:
        required: true
        type: string
      dispatched_at:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cjge-${{ inputs.dispatch_key }}
  cancel-in-progress: false

jobs:
  execute-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authoritative deployment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_ref }}

      - name: Execute CJGE assignment with Codex
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Execute Career Journey Growth Engine assignment ${{ inputs.assignment_id }} as the ${{ inputs.executive }} executive.
            First run: node ${{ inputs.entry_point }} claim ${{ inputs.executive }} ${{ inputs.assignment_id }} '${{ inputs.dispatch_key }}'
            Read every governing file returned by that claim, including AGENTS.md, the Project Constitution, the executive charter, runtime, and procedures.
            Perform the assignment within that governance and the existing cost, approval, evidence, and external-action rules.
            Before finishing, persist the actual terminal result and evidence by running:
            node ${{ inputs.entry_point }} result ${{ inputs.executive }} ${{ inputs.assignment_id }} <execution-id> '<result-json>'
            The result JSON must include dispatchKey '${{ inputs.dispatch_key }}', status, summary, evidence, metrics, verifiedAt, and externalActionAt when a new external action actually occurred.

      - name: Read durable terminal evidence
        id: evidence
        if: always()
        continue-on-error: true
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_RUNNER_TOKEN: ${{ secrets.CJGE_RUNNER_TOKEN }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          EXECUTIVE: ${{ inputs.executive }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          evidence=$(node "$ENTRY_POINT" evidence "$EXECUTIVE" "$ASSIGNMENT_ID" "$DISPATCH_KEY" 2>&1)
          delimiter="CJGE_$(date +%s)_${RANDOM}"
          {
            echo "result<<${delimiter}"
            echo "$evidence"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Record terminal Codex Action lifecycle
        if: always()
        env:
          CJGE_BASE_URL: ${{ secrets.CJGE_BASE_URL }}
          CJGE_DISPATCH_CALLBACK_TOKEN: ${{ secrets.CJGE_DISPATCH_CALLBACK_TOKEN }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          RESULT_EVIDENCE: ${{ steps.evidence.outputs.result }}
        run: |
          status=completed
          error=""
          if [ "$CODEX_OUTCOME" != "success" ]; then status=failed; error="codex-action outcome: ${CODEX_OUTCOME}"; fi
          payload=$(jq -n --arg assignmentId "$ASSIGNMENT_ID" --arg dispatchKey "$DISPATCH_KEY" --arg status "$status" --arg taskEvidence "$RESULT_EVIDENCE" --arg error "$error" '{assignmentId:$assignmentId,dispatchKey:$dispatchKey,status:$status,taskEvidence:$taskEvidence,error:$error}')
          curl --fail-with-body --retry 2 --max-time 30 -X POST "${CJGE_BASE_URL}/api/dispatch-status" -H "Authorization: Bearer ${CJGE_DISPATCH_CALLBACK_TOKEN}" -H "Content-Type: application/json" --data "$payload"
